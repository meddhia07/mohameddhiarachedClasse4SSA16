spring.application.name=NomPrenomClasse3
#DB Configuration:
spring.datasource.url=jdbc:mysql://localhost:3306/esprit?createDatabaseIfNotExist=true
spring.datasource.username=root
spring.datasource.password=
spring.jpa.show-sql=true
spring.jpa.hibernate.ddl-auto=update
server.port=8081
# Atelier 5 : prefixe commun de l'API REST (les controleurs n'ecrivent pas /api)
server.servlet.context-path=/api
# SpringDoc : description OpenAPI sur /api/v3/api-docs, Swagger UI sur /api/swagger-ui.html
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operations-sorter=method
springdoc.swagger-ui.tags-sorter=alpha
